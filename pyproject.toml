[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisqda"
version = "0.1.0.dev0"
description = "Local-only fail-closed privacy gateway for DigQDA"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
dependencies = [
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
  "spacy>=3.8,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.18,<5",
  "ollama>=0.6,<1",
  "rapidfuzz>=3,<4",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.12.0", "mypy>=1.16,<2"]

[project.scripts]
aegisqda = "aegisqda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
