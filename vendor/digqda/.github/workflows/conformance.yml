name: conformance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.12.0
      - run: python -m ruff check digqda 90_UTILITIES eval
      - run: python 90_UTILITIES/tests/run_tests.py
      - run: python eval/lint_cases.py
      - run: python eval/selftest_comparator.py
      - run: python eval/selftest_scope.py
      - run: python eval/run_semantic_canary.py --dry-run
      - run: DRY=1 bash 90_UTILITIES/smoke/run_smoke.sh
